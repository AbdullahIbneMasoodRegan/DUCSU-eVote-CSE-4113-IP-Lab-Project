# Render Blueprint for the staging service (NFR-10).
# One web service: Express serves /api and the built React app.
# Database: Neon or Supabase free Postgres — paste its URL into DATABASE_URL
# in the Render dashboard (sync: false keeps secrets out of git).
services:
  - type: web
    name: ducsu-evote-staging
    runtime: node
    plan: free
    # Same AWS region as the Neon database (us-east-2), so queries stay fast.
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm run build
    # Runs pending migrations, then starts the server.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: OTP_SECRET
        generateValue: true
      # console = OTP emails are printed to the Render log (dummy voter emails).
      # For real email set MAIL_TRANSPORT=brevo in the dashboard and fill
      # BREVO_API_KEY and MAIL_FROM (a sender verified in Brevo). Brevo uses
      # HTTPS, so it works even where outgoing SMTP ports are blocked.
      - key: MAIL_TRANSPORT
        value: console
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SEED_EC_PASSWORD
        sync: false
      - key: SEED_OBSERVER_PASSWORD
        sync: false
