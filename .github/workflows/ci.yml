name: CI

# Runs on every PR and every push to main. Make "lint-and-test" a required
# status check in the main branch protection rule so failing PRs cannot merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ducsu_evote_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/ducsu_evote_test
      OTP_SECRET: ci-only-otp-secret-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Lint
        run: |
          npm run lint --prefix server
          npm run lint --prefix client

      - name: Test server
        run: npm test --prefix server

      - name: Test client
        run: npm test --prefix client

      - name: Build client
        run: npm run build --prefix client

      # The dev-only x-dev-user header must never be enabled outside development.
      - name: Production config check
        run: |
          cd server
          NODE_ENV=production DATABASE_URL=postgres://x/y OTP_SECRET=prod-check-0123456789 \
            node -e "import('./src/core/config.js').then(({config}) => { if (config.devUserHeader) { console.error('dev header enabled in production'); process.exit(1) } console.log('ok') })"
